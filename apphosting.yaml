# Firebase App Hosting configuration.
# https://firebase.google.com/docs/app-hosting/configure
runConfig:
  # Scale to zero when idle (no cost without traffic).
  minInstances: 0
  # Hard cap so bot traffic cannot scale costs without limit.
  maxInstances: 2
  cpu: 1
  memoryMiB: 512

env:
  # Public Firebase web config (not secret: it only identifies the project).
  # Inlined into the browser bundle at build time.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyC6jebrQmNi3E2qYBRMpZRxErSvvYJEX64
    availability: [ BUILD ]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: gubbycardz-80976.firebaseapp.com
    availability: [ BUILD ]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: gubbycardz-80976
    availability: [ BUILD ]
  # Public base URL for sitemap.xml, robots.txt and canonical links.
  # Change here when the shop moves to its own domain.
  - variable: SITE_URL
    value: https://gubbycardz-web--gubbycardz-80976.europe-west4.hosted.app
    availability: [ BUILD, RUNTIME ]
  # Comma-separated admin emails, kept in Cloud Secret Manager instead of this public repo.
  # Change with: npx firebase apphosting:secrets:set adminEmails --project prod
  - variable: ADMIN_EMAILS
    secret: adminEmails
    availability: [ RUNTIME ]
  # Stripe keys from Cloud Secret Manager – never in this public repo. RUNTIME only, so they never
  # end up in build output. A test key (sk_test_…) lets only admins order (see orders/ordering-access.ts).
  # Rotate: new version in Secret Manager, then a new rollout.
  - variable: STRIPE_SECRET_KEY
    secret: stripeSecretKey
    availability: [ RUNTIME ]
  # Signing secret of the webhook endpoint /api/payment/webhook (Stripe dashboard → Developers → Webhooks).
  - variable: STRIPE_WEBHOOK_SECRET
    secret: stripeWebhookSecret
    availability: [ RUNTIME ]
